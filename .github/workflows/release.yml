name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/real_snow
          cp real_snow.py build/real_snow/__init__.py
          sed "s/^version = .*/version = \"$VERSION\"/" blender_manifest.toml > build/real_snow/blender_manifest.toml
          cd build/real_snow
          zip ../real_snow-$VERSION.zip __init__.py blender_manifest.toml

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/real_snow-*.zip --generate-notes
