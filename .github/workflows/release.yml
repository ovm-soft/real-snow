name: Build release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the zip to"
        required: true
        default: "v1.3.4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build extension zip
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p build/real_snow
          cp real_snow.py build/real_snow/__init__.py
          sed "s/^version = .*/version = \"$VERSION\"/" blender_manifest.toml > build/real_snow/blender_manifest.toml
          cd build/real_snow
          zip ../real_snow-$VERSION.zip __init__.py blender_manifest.toml

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" build/real_snow-*.zip --clobber
